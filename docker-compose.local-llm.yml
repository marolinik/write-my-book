# docker-compose.local-llm.yml
# OPT-IN overlay for full-stack LOCAL testing against the free LAN vLLM.
#
#   docker compose -f docker-compose.yml -f docker-compose.local-llm.yml up -d
#
# Routes ALL app+worker LLM traffic through local-llm-proxy (Anthropic
# Messages API -> OpenAI chat/completions translator running local-llm-proxy.py)
# to the self-hosted model — zero provider token burn, all roles served by a
# sonnet-tier generalist with tools + streaming.
#
# NEVER combine this overlay with docker-compose.prod.yml: production must use
# real providers (paid keys), never the LAN endpoint.
#
# To use paid providers locally instead: omit this overlay and set the
# provider keys in .env.docker as usual.

services:
  # ── Local LAN LLM proxy (Anthropic Messages API -> OpenAI chat/completions) ──
  # Dependency-free (Python stdlib only) — see local-llm-proxy.py.
  local-llm-proxy:
    image: python:3.12-slim
    restart: unless-stopped
    command: python /app/local-llm-proxy.py
    volumes:
      - ./local-llm-proxy.py:/app/local-llm-proxy.py:ro
    environment:
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://10.33.0.153:4000/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-deepseek-v4.1-flash}
      LOCAL_LLM_REASONING_EFFORT: ${LOCAL_LLM_REASONING_EFFORT:-medium}
      LOCAL_LLM_MODEL_MAP: ${LOCAL_LLM_MODEL_MAP:-}
      LOCAL_LLM_PIN_MODEL: ${LOCAL_LLM_PIN_MODEL:-}
      LOCAL_LLM_PORT: "30400"
      # In-container the proxy must accept the compose network; the published
      # port below is loopback-only on the host.
      LOCAL_LLM_BIND: "0.0.0.0"
    ports:
      # Loopback publish so a HOST-side dev server (next dev :3001, Playwright
      # e2e) reaches the gateway at http://localhost:30400 exactly like the
      # in-network app/worker containers do. Never bind this publicly.
      - "127.0.0.1:30400:30400"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:30400/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    depends_on:
      local-llm-proxy:
        condition: service_healthy
    environment:
      WMB_LLM_FORCE_LOCAL: ${WMB_LLM_FORCE_LOCAL:-1}
      WMB_LOCAL_PROXY_URL: http://local-llm-proxy:30400
      WMB_DEFAULT_MODEL: ${WMB_DEFAULT_MODEL:-local-deepseek/sonnet}
      WMB_LOCAL_FALLBACK: ${WMB_LOCAL_FALLBACK:-1}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://10.33.0.153:4000/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-deepseek-v4.1-flash}
      LOCAL_LLM_REASONING_EFFORT: ${LOCAL_LLM_REASONING_EFFORT:-medium}
      # This overlay's whole purpose is LAN endpoints, so custom-provider
      # base URLs may resolve to private ranges here (cloud metadata stays
      # blocked regardless). Hosted deployments must NEVER set this.
      WMB_ALLOW_PRIVATE_MODEL_HOSTS: "1"

  worker:
    depends_on:
      local-llm-proxy:
        condition: service_healthy
    environment:
      WMB_LLM_FORCE_LOCAL: ${WMB_LLM_FORCE_LOCAL:-1}
      WMB_LOCAL_PROXY_URL: http://local-llm-proxy:30400
      WMB_DEFAULT_MODEL: ${WMB_DEFAULT_MODEL:-local-deepseek/sonnet}
      WMB_LOCAL_FALLBACK: ${WMB_LOCAL_FALLBACK:-1}
      WMB_ALLOW_PRIVATE_MODEL_HOSTS: "1"
