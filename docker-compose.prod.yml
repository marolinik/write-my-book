# docker-compose.prod.yml
# Production override: app runtime production mode + backup sidecar.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Base docker-compose.yml already binds service ports to 127.0.0.1. A reverse
# proxy (nginx/Caddy/load balancer) should be the only public HTTPS entrypoint.

services:
  # Production refuses to boot on the base file's development-default
  # credentials: every secret below is REQUIRED (compose fails fast with the
  # named variable when unset) instead of silently falling back to
  # postgres/postgres-style dev values.
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}

  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for production}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}

  neo4j:
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set for production}
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' RETURN 1 | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  qdrant:
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set for production}

  app:
    environment:
      NODE_ENV: production
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set for production}
      # Optional: full /api/health/dependencies detail for external probes
      # (smoke CI). Anonymous callers always get only the verdict; container
      # loopback healthchecks always get full detail. Leave unset to run
      # tokenless (still sanitized for the public internet).
      HEALTH_TOKEN: ${HEALTH_TOKEN:-}
      # HARD REQUIREMENT: multi-tenant/hosted prod never serves user-defined
      # private-IP model endpoints. Do not set this in production.
      # (The opt-in lives in docker-compose.local-llm.yml for self-hosters.)

  worker:
    environment:
      NODE_ENV: production
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set for production}
      WORKER_HEALTH_PORT: "30401"

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts/backup-rotate.sh:/backup-rotate.sh:ro
    entrypoint: /bin/sh
    command: >
      -c "
      apk add --no-cache curl gzip &&
      curl -sLo /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc &&
      chmod +x /usr/local/bin/mc &&
      mc alias set wmb http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing wmb/wmb-projects/backups/hourly &&
      mc mb --ignore-existing wmb/wmb-projects/backups/daily &&
      mc mb --ignore-existing wmb/wmb-projects/backups/weekly &&
      echo 'Backup sidecar started' &&
      while true; do
        # Hard fail if DB creds are not actually set (prevents silent empty dumps).
        if [ -z \"$${POSTGRES_PASSWORD}\" ] || [ -z \"$${POSTGRES_USER}\" ]; then
          echo 'BACKUP FAILED: POSTGRES_PASSWORD/POSTGRES_USER is empty' >&2
          touch /tmp/backup-FAILED
          sleep 3600
          continue
        fi
        TIMESTAMP=$$(date +%Y%m%d-%H%M%S) &&
        # Dump to a temp file FIRST (no pipe): plain pg_dump exit code is
        # captured directly so a failure is never masked by gzip. Plain SQL
        # format is kept so restore stays `gunzip -c | psql`.
        PGPASSWORD=$${POSTGRES_PASSWORD} pg_dump -h postgres -U $${POSTGRES_USER} writemybook > /tmp/backup-$$TIMESTAMP.sql.gz.raw
        RC=$$?
        if [ \"$$RC\" -ne 0 ]; then
          echo \"BACKUP FAILED: pg_dump exit $$RC\" >&2
          rm -f /tmp/backup-$$TIMESTAMP.sql.gz.raw
          touch /tmp/backup-FAILED
          sleep 3600
          continue
        fi
        SIZE=$$(wc -c < /tmp/backup-$$TIMESTAMP.sql.gz.raw | tr -d ' ')
        if [ -z \"$$SIZE\" ] || [ \"$$SIZE\" -lt 1000 ]; then
          echo \"BACKUP FAILED: dump suspect ($${SIZE:-0} bytes)\" >&2
          rm -f /tmp/backup-$$TIMESTAMP.sql.gz.raw
          touch /tmp/backup-FAILED
          sleep 3600
          continue
        fi
        gzip -c /tmp/backup-$$TIMESTAMP.sql.gz.raw > /tmp/backup-$$TIMESTAMP.sql.gz &&
        rm -f /tmp/backup-$$TIMESTAMP.sql.gz.raw &&
        mc cp /tmp/backup-$$TIMESTAMP.sql.gz wmb/wmb-projects/backups/hourly/ &&
        rm -f /tmp/backup-$$TIMESTAMP.sql.gz &&
        # Success: clear the failure marker so a health gate stops alerting.
        rm -f /tmp/backup-FAILED &&
        /bin/sh /backup-rotate.sh &&
        echo \"Backup completed: $$TIMESTAMP\" &&
        sleep 3600;
      done
      "
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}

  # db-backup-watchdog: stale-backup detector. No new infrastructure beyond the mc
  # client already bundled in minio/mc. Each loop hour it checks that the newest
  # hourly backup object is under STALE_AFTER (default 2h) old. On a missing or
  # older backup it logs a searchable "BACKUP STALE" line, drops a durable marker
  # into the shared backup-health volume, and exits nonzero so an external monitor
  # (docker container state/restart or a passive healthcheck) can alert. The long
  # leading sleep throttles restart churn to at most once per loop.
  db-backup-watchdog:
    image: minio/mc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - backup-health:/var/backup-health:rw
    entrypoint: /bin/sh
    command: >
      -c "
      mc alias set wmb http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      echo 'Backup watchdog started' &&
      while true; do
        sleep $${WATCHDOG_INTERVAL} &&
        BPATH=wmb/wmb-projects/backups/hourly/ &&
        LATEST=$$(mc find $$BPATH --newer-than $${STALE_AFTER} 2>/dev/null) &&
        TS=$$(date +%Y%m%d-%H%M%S) &&
        if [ -n \"$$LATEST\" ]; then
          NEWEST=$$(echo \"$$LATEST\" | head -1) &&
          echo \"BACKUP OK at $$TS ($${STALE_AFTER} window): newest hourly backup present: $${NEWEST}\" &&
          rm -f /var/backup-health/stale-marker &&
          :;
        else
          echo \"BACKUP STALE at $$TS: no hourly backup newer than $${STALE_AFTER} under $$BPATH\" >&2 &&
          echo $$TS STALE > /var/backup-health/stale-marker &&
          exit 1;
        fi
      done
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}
      STALE_AFTER: ${BACKUP_STALE_AFTER:-2h}
      WATCHDOG_INTERVAL: ${BACKUP_WATCHDOG_INTERVAL:-3600}

volumes:
  # Shared marker dir: the watchdog writes /var/backup-health/stale-marker here on
  # stale/missing backups so an operator or host cron can read it without entering
  # the container. Mounted rw only in db-backup-watchdog.
  backup-health:
