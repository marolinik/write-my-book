# docker-compose.prod.yml
# Production override: localhost-bound ports + backup sidecar
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# All service ports bind to 127.0.0.1 so they are only accessible from
# the host machine. A reverse proxy (nginx/Caddy) handles public HTTPS.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  neo4j:
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"

  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

  app:
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/backup-rotate.sh:/backup-rotate.sh:ro
    entrypoint: /bin/sh
    command: >
      -c "
      apk add --no-cache curl &&
      curl -sLo /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc &&
      chmod +x /usr/local/bin/mc &&
      mc alias set wmb http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing wmb/wmb-projects/backups/hourly &&
      mc mb --ignore-existing wmb/wmb-projects/backups/daily &&
      mc mb --ignore-existing wmb/wmb-projects/backups/weekly &&
      echo 'Backup sidecar started' &&
      while true; do
        TIMESTAMP=$$(date +%Y%m%d-%H%M%S) &&
        PGPASSWORD=$${POSTGRES_PASSWORD} pg_dump -h postgres -U $${POSTGRES_USER} writemybook | gzip > /tmp/backup-$$TIMESTAMP.sql.gz &&
        mc cp /tmp/backup-$$TIMESTAMP.sql.gz wmb/wmb-projects/backups/hourly/ &&
        rm -f /tmp/backup-$$TIMESTAMP.sql.gz &&
        /bin/sh /backup-rotate.sh &&
        echo \"Backup completed: $$TIMESTAMP\" &&
        sleep 3600;
      done
      "
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wmb-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wmb-minio-prod}
