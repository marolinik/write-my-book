name: CI

on:
  push:
    # main plus the QA campaign branches (qa/bulletproof-*, etc.) so the
    # golden-path gate runs on campaign pushes, not just main.
    branches: [main, "qa/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Dummy values for static build/prisma generation. Real deployments must
  # inject production secrets through the hosting provider, never from git.
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/writemybook?schema=public"
  API_KEY_ENCRYPTION_SECRET: "changeme-generate-with-openssl-rand-hex-32-xxxx"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  DEV_AUTH_BYPASS: ""
  E2E_TEST_SECRET: "ci-placeholder"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "placeholder"
  CLERK_SECRET_KEY: "placeholder"
  CLERK_WEBHOOK_SECRET: "placeholder"
  STRIPE_SECRET_KEY: "placeholder"
  STRIPE_WEBHOOK_SECRET: "placeholder"
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "placeholder"
  STRIPE_FOUNDER_MONTHLY_PRICE_ID: "price_ci_founder_monthly"
  STRIPE_INDIE_MONTHLY_PRICE_ID: "price_ci_indie_monthly"
  STRIPE_INDIE_ANNUAL_PRICE_ID: "price_ci_indie_annual"
  STRIPE_PRO_MONTHLY_PRICE_ID: "price_ci_pro_monthly"
  STRIPE_PRO_ANNUAL_PRICE_ID: "price_ci_pro_annual"
  STRIPE_PUBLISHER_MONTHLY_PRICE_ID: "price_ci_publisher_monthly"
  STRIPE_PUBLISHER_ANNUAL_PRICE_ID: "price_ci_publisher_annual"
  S3_ENDPOINT: "http://localhost:9000"
  S3_ACCESS_KEY_ID: "placeholder"
  S3_SECRET_ACCESS_KEY: "placeholder"
  S3_BUCKET: "placeholder"
  # Validation-only dummies for the prod compose topology check: the prod
  # overlay hard-requires these via ${VAR:?} (operators must supply real
  # values at deploy time); `config` only interpolates, never connects.
  POSTGRES_PASSWORD: "ci-validation-postgres"
  REDIS_PASSWORD: "ci-validation-redis"
  MINIO_ROOT_USER: "ci-validation-minio"
  MINIO_ROOT_PASSWORD: "ci-validation-minio"
  NEO4J_PASSWORD: "ci-validation-neo4j"
  QDRANT_API_KEY: "ci-validation-qdrant"
  OPENAI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  SERPER_API_KEY: ""

jobs:
  # Golden-path regression gate: the authoritative pre-merge check. Runs the
  # full unit suite AND the tsc --noEmit typecheck (the campaign's #1
  # invariant), alongside the env/auth/db/billing/docker/lint/build/worker
  # contracts. Nothing here may be skipped or weakened.
  golden-path-gate:
    name: Golden-path gate (unit suite + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check web runtime environment contract
        run: npm run env:check
        env:
          REDIS_URL: "redis://localhost:6379"

      - name: Check worker runtime environment contract
        run: npm run env:check:worker
        env:
          REDIS_URL: "redis://localhost:6379"

      - name: Check Clerk auth contract
        run: npm run auth:check

      - name: Check database deploy preflight contract
        run: npm run db:deploy:check

      - name: Check Stripe billing contract
        run: npm run billing:check
      - name: Validate Docker Compose production topology
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/tmp/wmb-compose.yml

      - name: Pull the object store images the deployment depends on
        # A registry dropped these once and nothing noticed for weeks.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull minio minio-init
          docker build -f docker/db-backup/Dockerfile docker/db-backup

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: npx vitest run --coverage.enabled

      # P2-70: the coverage report, so the number behind the floor is visible.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage/unit
          retention-days: 14

      - name: Build Next.js app
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Build worker
        if: ${{ !cancelled() }}
        run: npm run worker:build

  # D13 / P2-62: the PDF export's fonts and tools exist in the image that
  # ships them. Builds only the export-tools stage (pandoc, Typst checked by
  # sha256, Noto CJK/Arabic/Devanagari), then renders a page in every script.
  export-tools:
    name: Export tools image (fonts + Typst)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build the export-tools stage
        run: docker build --target export-tools -t wmb-export-tools .
      - name: Fonts and a page in every script
        run: docker run --rm -i wmb-export-tools sh < scripts/check-export-fonts.sh

  # P2-66: a real export, opened. Installs the production tool versions
  # (pandoc 3.10, Typst 0.13.0, both checksum-pinned) and runs the integration
  # tests with REQUIRE_EXPORT_TOOLS=1, so a missing tool fails instead of
  # skipping.
  export-integration:
    name: Export integration (real pandoc + Typst)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pandoc 3.10 and Typst 0.13.0
        run: |
          curl -fsSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.10/pandoc-3.10-1-amd64.deb
          echo "d502599878eb29af3ae5f0cb5d559134df96534125d452c7a0674a5bad2c5ecf  /tmp/pandoc.deb" | sha256sum -c -
          sudo apt-get install -y /tmp/pandoc.deb
          curl -fsSL -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.13.0/typst-x86_64-unknown-linux-musl.tar.xz
          echo "cd1148da61d6844e62c330fc6222e988480acafe33b76daec8eb5d221258feb6  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          pandoc --version | head -1
          typst --version
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Export and import integration tests
        env:
          REQUIRE_EXPORT_TOOLS: "1"
        run: npx vitest run tests/unit/integration

  # P2-62 (item 36): build what production runs. Both images build from the
  # pinned base on every PR, so a Dockerfile, lockfile or dependency change
  # that breaks the image is caught before deploy.
  docker-images:
    name: Docker images build (web + worker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build the web image
        run: docker build -f Dockerfile -t wmb-web:ci .
      - name: Build the worker image
        run: docker build -f Dockerfile.worker -t wmb-worker:ci .
      - name: The worker image carries no Next (Wave 7 Task 5)
        run: |
          docker image inspect wmb-worker:ci --format 'worker image: {{.Size}} bytes'
          docker run --rm --entrypoint sh wmb-worker:ci -c '
            for p in next @next @sentry/nextjs; do
              if [ -e "node_modules/$p" ]; then echo "node_modules/$p is in the worker image"; exit 1; fi
            done
            node -e "require(\"./dist-worker/lib/logger.js\")"'
      - name: The web image carries pandoc, Typst and the fonts
        run: docker run --rm -i --entrypoint sh wmb-web:ci < scripts/check-export-fonts.sh
